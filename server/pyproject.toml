[project]
name = "agent-shell-server"
version = "0.2.0"
description = "Local Deep Agents configuration and OpenAI-compatible API shell"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.11",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "httpx-curl-cffi>=0.1.5,<0.2",
  "langchain>=1.3.18,<2.0",
  "langchain-anthropic>=1.7.0,<2.0",
  "langchain-core>=1.6.1,<2.0",
  "langsmith>=0.11.2,<0.12",
  "langchain-deepseek>=1.1.0,<2.0",
  "langchain-google-genai>=4.3.7,<5.0",
  "langchain-google-vertexai>=3.2.4,<4.0",
  "langchain-openai>=1.4.1,<2.0",
  "langchain-xai>=1.3.0,<2.0",
  "langgraph>=1.2.10,<1.3.0",
  "jsonschema>=4.23,<5.0",
  "packaging>=26.3,<27.0",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.18,<1.0",
  "pyyaml>=6.0.2",
  "uvicorn>=0.52.1",
  "websockets>=15.0.1,<16.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9.1,<3.0",
  "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_shell"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../test"]
addopts = "-p no:cacheprovider"
