[project]
name = "agent-shell-server"
version = "0.2.0"
description = "Local Deep Agents configuration and OpenAI-compatible API shell"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.19",
  "fastapi>=0.141.1",
  "httpx[http2]>=0.28.1",
  "httpx-curl-cffi>=0.1.5,<0.2",
  "langchain>=1.4.2,<2.0",
  "langchain-core>=1.6.5,<2.0",
  "langchain-mcp-adapters==0.3.2",
  "langsmith>=0.14.0,<0.15.0",
  "langchain-deepseek>=1.1.1,<2.0",
  "langchain-google-genai>=4.4.0,<5.0",
  "langchain-openai>=1.6.6,<2.0",
  "langgraph>=1.2.12,<1.3.0",
  "langgraph-api==0.14.4",
  "langgraph-cli[inmem]==0.4.32",
  "langgraph-runtime-inmem==0.34.1",
  "langgraph-sdk==0.4.5",
  "jsonschema>=4.23,<5.0",
  "packaging>=26.3,<27.0",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.18,<1.0",
  "pyyaml>=6.0.2",
  "uvicorn>=0.52.1",
  "websockets>=15.0.1,<16.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9.1,<3.0",
  "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_shell"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../test"]
addopts = "-p no:cacheprovider"
